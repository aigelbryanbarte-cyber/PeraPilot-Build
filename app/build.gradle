plugins {
    id 'com.android.application'
}

android {
    namespace 'com.perapilot.moneycoach'
    compileSdk 35

    defaultConfig {
        applicationId 'com.perapilot.moneycoach.v21'
        minSdk 24
        targetSdk 35
        versionCode 4
        versionName '2.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
